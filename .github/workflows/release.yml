name: Release

# Poussez un tag `vX.Y.Z` pour publier. La version du tag est celle qui
# finit dans l'Info.plist : elle n'est écrite nulle part ailleurs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, sans le v (ex. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publication de $version"

      - name: Stamp the bundle version
        run: |
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" \
            Resources/Info.plist
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleVersion ${{ github.run_number }}" \
            Resources/Info.plist

      - name: Test
        run: swift test

      # Le certificat vit dans un trousseau jetable, propre à ce job : rien
      # ne subsiste sur le runner, et le trousseau de connexion n'est pas touché.
      - name: Import the signing certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(uuidgen)"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo -n "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"

          # Sans cette autorisation, codesign réclamerait une validation
          # interactive impossible sur un runner.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$password" "$keychain" >/dev/null

          security list-keychain -d user -s "$keychain" login.keychain-db

      - name: Build and sign
        env:
          COCKER_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: ./Scripts/bundle.sh release

      - name: Verify the signature
        run: |
          codesign --verify --strict --verbose=2 build/Cocker.app
          codesign -dvvv build/Cocker.app 2>&1 | grep -q "flags=.*runtime" \
            || { echo "::error::hardened runtime absent, Apple refusera la notarisation"; exit 1; }

      # L'app et l'image disque se notarisent séparément : agrafer les deux
      # permet à l'utilisateur d'ouvrir aussi bien le .dmg que l'app qu'il en
      # sort, y compris hors ligne.
      - name: Notarize the app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo -n "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"

          # `ditto` et non `zip` : lui seul préserve les liens symboliques et
          # les attributs étendus du bundle, que la notarisation vérifie.
          ditto -c -k --keepParent build/Cocker.app "$RUNNER_TEMP/submit.zip"

          xcrun notarytool submit "$RUNNER_TEMP/submit.zip" \
            --key "$RUNNER_TEMP/asc.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m

      # L'agrafage inscrit le ticket dans le bundle : l'app s'ouvre ensuite
      # même sans réseau, sur une machine qui n'a jamais vu ce binaire.
      - name: Staple the app
        run: |
          xcrun stapler staple build/Cocker.app
          xcrun stapler validate build/Cocker.app
          spctl -a -vvv -t exec build/Cocker.app

      - name: Build the disk image
        env:
          COCKER_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          brew install create-dmg
          ./Scripts/make-dmg.sh "${{ steps.version.outputs.version }}"

      - name: Notarize the disk image
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          dmg="build/Cocker-${{ steps.version.outputs.version }}.dmg"

          xcrun notarytool submit "$dmg" \
            --key "$RUNNER_TEMP/asc.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m

          rm "$RUNNER_TEMP/asc.p8"

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t open --context context:primary-signature "$dmg"

      - name: Package
        run: |
          # Rezippé après agrafage : l'archive envoyée à Apple ne contient pas
          # encore le ticket. Le zip reste publié à côté du dmg, plus commode
          # pour un script ou une CI.
          ditto -c -k --keepParent build/Cocker.app \
            "$RUNNER_TEMP/Cocker-${{ steps.version.outputs.version }}.zip"

      # Le cask pointe vers le dmg qu'on vient de publier. Sans TAP_TOKEN,
      # l'étape est sautée : le reste de la release ne doit pas échouer parce
      # qu'un dépôt annexe n'est pas configuré.
      - name: Update the Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN absent, cask non mis à jour"
            exit 0
          fi

          dmg="build/Cocker-$VERSION.dmg"
          checksum=$(shasum -a 256 "$dmg" | awk '{ print $1 }')

          git clone --depth 1 \
            "https://x-access-token:$TAP_TOKEN@github.com/Bardyl/homebrew-tap.git" \
            "$RUNNER_TEMP/tap"

          mkdir -p "$RUNNER_TEMP/tap/Casks"
          sed -e "s/__VERSION__/$VERSION/" -e "s/__SHA256__/$checksum/" \
            Packaging/cocker.rb.template > "$RUNNER_TEMP/tap/Casks/cocker.rb"

          cd "$RUNNER_TEMP/tap"

          # `git add` avant de comparer : `git diff` ignore les fichiers non
          # suivis, si bien qu'un cask créé pour la première fois passait pour
          # « déjà à jour » et n'était jamais poussé.
          git add Casks/cocker.rb
          if git diff --cached --quiet; then
            echo "cask déjà à jour"
            exit 0
          fi

          git -c user.name="Mathieu MENUT" -c user.email="mathieu@menut.pro" \
            commit -m "Cocker $VERSION"
          git push
          echo "cask publié en $VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          zip="$RUNNER_TEMP/Cocker-${{ steps.version.outputs.version }}.zip"
          dmg="build/Cocker-${{ steps.version.outputs.version }}.dmg"

          # Les notes vivent dans l'annotation du tag : écrites à la main,
          # versionnées avec ce qu'elles décrivent.
          #
          # On interroge l'API plutôt que git : `actions/checkout` matérialise
          # un tag *léger* sur le runner, dont `%(contents)` renvoie le message
          # du dernier commit. C'est silencieux, et on publie alors des notes
          # plausibles mais fausses.
          object_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type')
          if [ "$object_type" != "tag" ]; then
            echo "::error::$tag est un tag léger : pas d'annotation, donc pas de notes"
            exit 1
          fi

          object_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.message' \
            > "$RUNNER_TEMP/notes.md"

          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::l'annotation de $tag est vide"
            exit 1
          fi

          # Idempotent : republier un tag ne doit pas laisser la release avec
          # ses anciennes notes.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "Cocker ${{ steps.version.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$tag" "$dmg" "$zip" --clobber
          else
            gh release create "$tag" "$dmg" "$zip" \
              --title "Cocker ${{ steps.version.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
          fi
