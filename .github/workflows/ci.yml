name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # Cocker cible macOS 14, mais a jusqu'ici été compilé uniquement avec une
    # Xcode bêta. Ce job est là d'abord pour prouver qu'une version publiée y
    # arrive aussi.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Check translations
        run: python3 Scripts/check-translations.py

      # La configuration vit dans .swift-format : 4 espaces comme Xcode,
      # 100 colonnes. Le but est d'éviter les débats de style en revue.
      - name: Check formatting
        run: swift format lint --strict -r Sources Tests

      # Les tests ne couvrent que les parseurs ; assembler le bundle vérifie
      # que le script, l'Info.plist et la génération d'icône tiennent debout.
      - name: Assemble the app bundle
        run: ./Scripts/bundle.sh release

      - name: Check the bundle is well-formed
        run: |
          test -x build/Cocker.app/Contents/MacOS/Cocker
          test -f build/Cocker.app/Contents/Info.plist
          test -f build/Cocker.app/Contents/Resources/Cocker.icns
          codesign --verify --verbose build/Cocker.app
